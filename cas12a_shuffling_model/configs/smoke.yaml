seed: 13

paths:
  domains_dir: domains
  sequence_results: Sequence_Result.xlsx
  atlas_fasta: cas12a.fasta
  parents:
    As: AsCas12a.prot
    Fn: FnCas12a.prot
    Lb: LbCas12a.prot
    Mb2: Mb2Cas12a.prot
  out_processed_dir: cas12a_shuffling_model/data/processed
  out_active_dir: cas12a_shuffling_model/data/active

domain_translation:
  try_reverse_complement: true
  top_k_per_domain: 3
  ambiguous_delta_score: 25.0
  enforce_parent_slot_order: true
  max_allowed_stop_in_trimmed: 0
  allowed_parent_overlap_aa: 5

alignment:
  mode: local
  matrix: BLOSUM62
  open_gap_score: -10.0
  extend_gap_score: -0.5

teacher:
  model_source: hf
  model_name_or_path: nferruz/ProtGPT2
  model_name: nferruz/ProtGPT2
  model_revision: null
  adapter_path: null
  add_spaces: true
  max_length: null
  cache_sqlite: cas12a_shuffling_model/data/processed/teacher_scores.sqlite
  junction_window:
    left: 15
    right: 15

actives:
  slot_columns: null
  allowed_letters: [A, L, F, M]

distill:
  source_mode: mixed
  n_samples: 6
  chimera_samples: 12
  natural_samples: 16
  include_actives: false
  teacher_batch_size: 1
  natural_fasta: cas12a.fasta
  natural_min_len: 300
  natural_max_len: null
  natural_deduplicate: true
  natural_with_junction: false
  output_csv: cas12a_shuffling_model/data/processed/distill_teacher_scores_smoke.csv

teacher_adapt:
  output_dir: cas12a_shuffling_model/outputs/teacher_adapt
  base_model_name_or_path: nferruz/ProtGPT2
  base_model_revision: null
  add_spaces: true
  method: auto
  partial_last_n_layers: 1
  lora_r: 4
  lora_alpha: 8
  lora_dropout: 0.05
  min_len: 300
  max_len_filter: null
  deduplicate: true
  train_val_fraction: 0.2
  max_train_sequences: 24
  max_val_sequences: 8
  max_length: 512
  batch_size: 1
  eval_batch_size: 1
  grad_accum_steps: 1
  epochs: 1
  lr: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  num_workers: 0
  cpu_threads: 10
  interop_threads: 4
  log_every_steps: 2

teacher_adapt_eval:
  output_dir: cas12a_shuffling_model/outputs/teacher_adapt_eval
  natural_eval_size: 24
  background_size: 24
  score_batch_size: 1

calibration:
  output_dir: cas12a_shuffling_model/outputs/calibration
  background_size: 10
  C: 1.0
  class_weight_positive: 1.0
  class_weight_background: 0.5
  s_min_quantile: 0.10

search:
  mode: sampled
  output_dir: cas12a_shuffling_model/outputs/ranking
  sample_size: 120
  shortlist_size: 40
  teacher_rerank_size: 20
  top_k: 10
  min_hamming: 1
  student_batch_size: 8
  teacher_batch_size: 1
  progress_every: 100
  checkpoint_every_batches: 10
  student_rank_weights:
    global: 1.0
    junction_mean: 0.5
    junction_min: 0.5

figures:
  output_dir: cas12a_shuffling_model/outputs/figures
  top_n_heatmap: 10
  max_k_overlap: 10

student:
  distill_csv: cas12a_shuffling_model/data/processed/distill_teacher_scores_smoke.csv
  output_dir: cas12a_shuffling_model/outputs/student
  model:
    model_type: transformer
    embed_dim: 96
    hidden_dim: 96
    num_layers: 2
    num_heads: 4
    ff_dim: 256
    dropout: 0.0
    max_positions: 2048
  train:
    batch_size: 2
    epochs: 1
    lr: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    val_fraction: 0.34
    nll_weight: 1.0
    global_weight: 1.0
    junction_weight: 1.0
    natural_global_weight: 1.0
    chimera_global_weight: 1.0
    natural_junction_weight: 1.0
    chimera_junction_weight: 1.0
    balance_source_types: false
    num_workers: 2
    cpu_threads: 10
    interop_threads: 4
