seed: 13

paths:
  domains_dir: domains
  sequence_results: Sequence_Result.xlsx
  atlas_fasta: cas12a.fasta
  parents:
    As: AsCas12a.prot
    Fn: FnCas12a.prot
    Lb: LbCas12a.prot
    Mb2: Mb2Cas12a.prot
  out_processed_dir: cas12a_shuffling_model/data/processed
  out_active_dir: cas12a_shuffling_model/data/active

domain_translation:
  try_reverse_complement: true
  top_k_per_domain: 5
  ambiguous_delta_score: 25.0
  enforce_parent_slot_order: true
  max_allowed_stop_in_trimmed: 0
  allowed_parent_overlap_aa: 5

alignment:
  mode: local
  matrix: BLOSUM62
  open_gap_score: -10.0
  extend_gap_score: -0.5

teacher:
  model_source: hf
  model_name_or_path: nferruz/ProtGPT2
  model_name: nferruz/ProtGPT2
  model_revision: null
  adapter_path: null
  add_spaces: true
  max_length: null
  cache_sqlite: cas12a_shuffling_model/data/processed/teacher_scores.sqlite
  junction_window:
    left: 25
    right: 25

actives:
  slot_columns: null   # null => use first 11 columns
  allowed_letters: [A, L, F, M]

distill:
  source_mode: chimera
  n_samples: 64
  chimera_samples: 64
  natural_samples: 256
  include_actives: true
  teacher_batch_size: 1
  natural_fasta: cas12a.fasta
  natural_min_len: 300
  natural_max_len: null
  natural_deduplicate: false
  natural_with_junction: false
  output_csv: cas12a_shuffling_model/data/processed/distill_teacher_scores.csv

teacher_adapt:
  output_dir: cas12a_shuffling_model/outputs/teacher_adapt
  base_model_name_or_path: nferruz/ProtGPT2
  base_model_revision: null
  add_spaces: true
  method: auto
  partial_last_n_layers: 2
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  min_len: 300
  max_len_filter: null
  deduplicate: false
  train_val_fraction: 0.1
  max_train_sequences: 12000
  max_val_sequences: 2000
  max_length: 2048
  batch_size: 1
  eval_batch_size: 1
  grad_accum_steps: 8
  epochs: 1
  lr: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  num_workers: 4
  cpu_threads: 10
  interop_threads: 4
  log_every_steps: 20

teacher_adapt_eval:
  output_dir: cas12a_shuffling_model/outputs/teacher_adapt_eval
  natural_eval_size: 128
  background_size: 128
  score_batch_size: 1

calibration:
  output_dir: cas12a_shuffling_model/outputs/calibration
  background_size: 600
  C: 1.0
  class_weight_positive: 1.0
  class_weight_background: 0.2
  s_min_quantile: 0.10

search:
  mode: exhaustive
  output_dir: cas12a_shuffling_model/outputs/ranking
  sample_size: 50000
  shortlist_size: 10000
  teacher_rerank_size: 1000
  top_k: 50
  min_hamming: 2
  student_batch_size: 16
  teacher_batch_size: 1
  progress_every: 50000
  checkpoint_every_batches: 200
  shortlist_strategy: weighted
  union_per_metric_size: 10000
  rerank_selection: weighted
  rerank_exploit_ratio: 0.70
  active_probe: true
  active_probe_csv: null
  student_rank_weights:
    global: 1.0
    junction_mean: 0.5
    junction_min: 0.5

figures:
  output_dir: cas12a_shuffling_model/outputs/figures
  top_n_heatmap: 50
  max_k_overlap: 50

student:
  distill_csv: cas12a_shuffling_model/data/processed/distill_teacher_scores.csv
  output_dir: cas12a_shuffling_model/outputs/student
  model:
    model_type: transformer
    embed_dim: 192
    hidden_dim: 256
    num_layers: 4
    num_heads: 6
    ff_dim: 768
    dropout: 0.1
    max_positions: 4096
  train:
    batch_size: 8
    epochs: 12
    lr: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    val_fraction: 0.2
    nll_weight: 0.02
    global_weight: 0.2
    junction_weight: 0.2
    natural_global_weight: 1.0
    chimera_global_weight: 1.0
    natural_junction_weight: 1.0
    chimera_junction_weight: 1.0
    correlation_weight: 0.5
    correlation_on_chimera_only: true
    pairwise_weight: 1.0
    pairwise_margin: 0.02
    pairwise_pairs_per_batch: 128
    pairwise_min_teacher_diff: 0.01
    pairwise_ignore_close_diff: 0.01
    pairwise_hard_ratio: 0.3
    pairwise_medium_ratio: 0.5
    pairwise_easy_ratio: 0.2
    pairwise_length_bin_size: 64
    pairwise_margin_alpha: 0.5
    pairwise_margin_min: 0.0
    pairwise_margin_max: 0.25
    pairwise_on_chimera_only: true
    pairwise_warmup_epochs: 1
    pairwise_ramp_epochs: 4
    stage_a_natural_epochs: 2
    stage_a_batch_size: 8
    stage_b_chimera_only: true
    stage_b_lr_scale: 0.5
    normalize_teacher_global: true
    normalize_length_bin_size: 64
    normalize_min_group_size: 32
    nll_final_weight: 0.005
    nll_decay_start_epoch: 3
    nll_decay_end_epoch: 8
    top_loss_weight: 0.15
    top_fraction: 0.10
    top_margin: 0.0
    top_pairs_per_batch: 64
    top_on_chimera_only: true
    topk_fracs: [0.01, 0.05, 0.10]
    best_metric: global_corr_chimera
    best_metric_mode: max
    balance_source_types: false
    num_workers: 4
    cpu_threads: 10
    interop_threads: 4
