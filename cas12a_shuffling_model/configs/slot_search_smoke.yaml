seed: 13

paths:
  sequence_results: Sequence_Result.xlsx
  out_processed_dir: cas12a_shuffling_model/data/processed
  out_active_dir: cas12a_shuffling_model/data/active

teacher:
  model_source: hf
  model_name_or_path: nferruz/ProtGPT2
  model_name: nferruz/ProtGPT2
  model_revision: null
  adapter_path: null
  add_spaces: true
  max_length: null
  cache_sqlite: cas12a_shuffling_model/data/processed/teacher_scores.sqlite
  junction_window:
    left: 15
    right: 15

slot_search:
  teacher_export:
    output_dir: cas12a_shuffling_model/outputs/slot_search_smoke/teacher_export
    output_table: cas12a_shuffling_model/outputs/slot_search_smoke/teacher_export/teacher_labels_smoke.csv
    n_samples: 256
    score_batch_size: 2
    normalize_length_bin_size: 50
    normalize_min_group_size: 8
    include_junction_features: true
    include_active_rows: true
    slot_code_col: slot_code_11
    sequence_col: sequence_aa

  assistant_ranker:
    output_dir: cas12a_shuffling_model/outputs/slot_search_smoke/assistant_ranker
    feature_cols: [teacher_junction_mean, teacher_junction_min, length]
    model:
      slot_embed_dim: 12
      hidden_dim: 64
      num_layers: 2
      dropout: 0.1
      use_extra_features: true
      dual_head: true
      inference_alpha: 0.15
    train:
      batch_size: 64
      epochs: 4
      lr: 0.001
      weight_decay: 0.0001
      grad_clip: 1.0
      val_fraction: 0.25
      target_col: teacher_seq_score_norm
      local_target_col: active_local_target
      hard_negative_col: is_hard_negative
      local_distance_col: local_active_distance
      local_max_distance: 4
      chimera_only: true
      objective_mode: active_first
      active_local_weight: 1.0
      top_tail_weight: 0.5
      pair_local_weight: 0.2
      teacher_corr_weight: 0.1
      active_local_pairs_per_batch: 128
      top_tail_pairs_per_batch: 128
      pair_local_pairs_per_batch: 128
      active_local_margin: 0.20
      top_tail_margin: 0.10
      pair_local_min_gap: 0.0
      pair_local_near_tie_gap: 0.0
      top_weight: 1.0
      corr_weight: 0.3
      pair_weight: 0.2
      pair_min_gap: 0.01
      pair_near_tie_gap: 0.01
      pair_pairs_per_batch: 128
      pair_easy_ratio: 0.2
      pair_medium_ratio: 0.5
      pair_hard_ratio: 0.3
      pair_margin: 0.0
      pair_margin_alpha: 0.5
      pair_margin_min: 0.0
      pair_margin_max: 0.3
      top_fraction: 0.10
      top_pairs_per_batch: 64
      top_margin: 0.0
      oversample_top_fraction: 0.10
      oversample_weight: 2.0
      active_codes_path: Sequence_Result.xlsx
      active_sample_weight: 8.0
      hard_negative_sample_weight: 4.0
      active_anchor_repeat: 16
      active_force_train: false
      min_active_in_val: 2
      active_loss_weight: 0.8
      active_pairs_per_batch: 128
      active_margin: 0.20
      active_min_target_gap: -1.0
      best_metric: active_hits_top500
      num_workers: 0
      cpu_threads: 10
      interop_threads: 4

  slot_scorer:
    output_dir: cas12a_shuffling_model/outputs/slot_search_smoke/slot_scorer
    model:
      slot_embed_dim: 8
      mlp_hidden_dim: 64
      mlp_layers: 2
      dropout: 0.1
      enable_pairwise: true
    train:
      batch_size: 128
      epochs: 5
      lr: 0.001
      weight_decay: 0.0001
      grad_clip: 1.0
      val_fraction: 0.25
      target_col: assistant_score
      top_weight: 1.0
      corr_weight: 0.4
      pair_weight: 0.2
      pair_min_gap: 0.01
      pair_near_tie_gap: 0.01
      pair_pairs_per_batch: 128
      pair_easy_ratio: 0.2
      pair_medium_ratio: 0.5
      pair_hard_ratio: 0.3
      pair_margin: 0.0
      pair_margin_alpha: 0.5
      pair_margin_min: 0.0
      pair_margin_max: 0.3
      top_fraction: 0.10
      top_pairs_per_batch: 64
      top_margin: 0.0
      hard_neg_weight: 0.3
      hard_neg_top_fraction: 0.10
      hard_neg_pairs_per_batch: 64
      hard_neg_margin: 0.05
      oversample_top_fraction: 0.10
      oversample_weight: 2.0
      active_codes_path: Sequence_Result.xlsx
      active_sample_weight: 8.0
      active_force_train: true
      active_loss_weight: 1.0
      active_pairs_per_batch: 128
      active_margin: 0.20
      active_min_target_gap: -1.0
      best_metric: global_corr_chimera
      num_workers: 0
      cpu_threads: 10
      interop_threads: 4

  scan:
    output_dir: cas12a_shuffling_model/outputs/slot_search_smoke/full_scan
    batch_size: 32768
    shortlist_size: 2000
    top_k: 20
    save_all_scores: false
    progress_every_batches: 2
    start_index: 0
    end_index: 262144

  gated_policy:
    policy_mode: hard_gated
    gate_signal: kernel_similarity_to_actives
    alpha_far: 0.65
    alpha_near: 0.10
    similarity_beta: 0.15
    kernel_gamma: 0.70
    density_radius: 3
    density_gamma: 1.0
    hard_distance_threshold: 3
    hard_similarity_threshold: 0.55
    soft_center: 0.35
    soft_scale: 8.0
    recall_policy: scan_teacher_mix
    recall_teacher_weight: 0.70
    recall_active_weight: 0.10
    recall_scan_weight: 0.20
    recall_pool_size: 2000
    teacher_usage_mode: recall_only
    teacher_plausibility_quantile: 0.05
    teacher_plausibility_penalty: 0.50

  rerank:
    output_dir: cas12a_shuffling_model/outputs/slot_search_smoke/rerank
    batch_size: 512
    top_k: 20
    include_sequence: false
    active_table: Sequence_Result.xlsx
    dual_head_alpha: 0.15
    policy_mode: hard_gated
    gate_signal: kernel_similarity_to_actives
    alpha_far: 0.65
    alpha_near: 0.10
    similarity_beta: 0.15
    recall_policy: scan_teacher_mix
    recall_pool_size: 2000
    teacher_usage_mode: recall_only
    active_prior_mode: kernel_density_over_actives
    active_prior_beta: 0.15
    active_prior_gamma: 0.70
    active_prior_base_score_col: assistant_score
    active_prior_beta_sweep: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25]
    active_eval_top_ks: [20, 50, 100]
    recall_eval_top_ks: [500, 1000, 2000]
    teacher_audit: true
    teacher_audit_top_k: 50
    teacher_audit_batch_size: 4

  hard_negative_mining:
    output_dir: cas12a_shuffling_model/outputs/slot_search_smoke/hard_negative_mining
    active_table: Sequence_Result.xlsx
    score_col: assistant_score
    top_pool_size: 2000
    max_negatives: 500
    min_distance: 1
    max_distance: 4
    active_score_quantile: 0.50
    local_target_col: active_local_target
    hard_negative_col: is_hard_negative
    distance_col: local_active_distance
    active_col: is_active

  local_expand:
    output_dir: cas12a_shuffling_model/outputs/slot_search_smoke/local_expand
    active_table: Sequence_Result.xlsx
    seed_score_col: final_score
    top_seed_count: 100
    active_distance_cap: 3
    no_active_seeds: false
    no_hamming_1: false
    hamming_2_top_seeds: 20
    keep_original_codes: false
